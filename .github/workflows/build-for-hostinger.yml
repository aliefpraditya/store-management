# vendor/ and public/build are gitignored, so they cannot come from a Git pull on the server. CI installs the
# production dependencies, builds the frontend, and copies the whole app to Hostinger over SSH (rsync), then runs the
# migrations there. Nothing is pushed to another branch: main is the only branch. Pull requests only prove that the
# build works; nothing is deployed for them.
name: Build for Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-for-hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, intl, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      # Needs the HOSTINGER_* secrets; without them this step is skipped. The `P` filters protect what only exists on
      # the server (.env, storage contents, cache files, the storage link) from `--delete`, and `--exclude` keeps
      # development files off the server (they are also left alone there).
      - name: Copy the app to the server and run the migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$APP_PATH" ] || { [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; }; then
            echo "HOSTINGER_* secrets are not set: skipping the deploy and the migrations."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          SSH_OPTIONS="-p ${SSH_PORT:-22} -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          # A key is preferred; the password is for a server where no key has been registered in hPanel.
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key $SSH_OPTIONS"
          else
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH_COMMAND="sshpass -e ssh -o PubkeyAuthentication=no $SSH_OPTIONS"
          fi

          rsync -az --delete -e "$SSH_COMMAND" \
            --filter='P /.env' \
            --filter='P /storage/***' \
            --filter='P /bootstrap/cache/*.php' \
            --filter='P /public/storage' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/docs/' \
            ./ "$SSH_USER@$SSH_HOST:$APP_PATH/"

          # `migrate` is the central database, `tenants:migrate` every registered store database.
          $SSH_COMMAND "$SSH_USER@$SSH_HOST" "set -e
            cd '$APP_PATH'
            php artisan migrate --force
            php artisan tenants:migrate --force
            php artisan optimize:clear"
