# Hostinger's Git deployment only pulls what is in the repository, and vendor/ and public/build are gitignored.
# So CI installs the production dependencies, builds the frontend, and force-pushes the result to the `production`
# branch, which Hostinger pulls. Pull requests only prove that the build works; nothing is pushed for them.
name: Build for Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-for-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, intl, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Commit the build to the production branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Not needed on the server; also, a token without the `workflows` scope cannot push workflow files.
          rm -rf .github tests docs node_modules

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan production
          git add -A
          git add -f vendor public/build
          git commit -m "Build ${GITHUB_SHA::7} for Hostinger" -m "Source commit: ${GITHUB_SHA}"
          git push --force origin production

      # Hostinger pulls the production branch on its own (Git webhook). This step does not wait for that pull, so a
      # migration that is new in this push is only applied if the pull has already finished. Needs the HOSTINGER_*
      # secrets; without them this step is skipped.
      - name: Run the migrations on the server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$APP_PATH" ]; then
            echo "HOSTINGER_* secrets are not set: skipping the migrations."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # `migrate` is the central database, `tenants:migrate` every registered store database.
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "set -e
            cd '$APP_PATH'
            php artisan migrate --force
            php artisan tenants:migrate --force
            php artisan optimize:clear"
